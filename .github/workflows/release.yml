name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to check the tag is on main

      # Tags aren't tied to a branch, so a v* tag pushed from any branch would
      # otherwise cut a release. Only proceed if the tagged commit is contained
      # in main.
      - name: Verify tag is on main
        id: guard
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME is on main — proceeding."
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $GITHUB_REF_NAME is not on main; skipping release."
          fi

      - name: Package addon
        if: steps.guard.outputs.on_main == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Stage the addon inside a top-level "HKSuite" folder so the zip
          # extracts straight into Interface/AddOns as AddOns/HKSuite/.
          mkdir -p dist/HKSuite
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='CLAUDE.md' \
            --exclude='dist' \
            ./ dist/HKSuite/

          # Keep the .toc version in sync with the tag.
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" dist/HKSuite/HKSuite.toc

          cd dist
          zip -r "HKSuite-${GITHUB_REF_NAME}.zip" HKSuite

      - name: Create GitHub Release
        if: steps.guard.outputs.on_main == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish as a pre-release (alpha). Promote to Latest once confirmed:
          #   gh release edit <tag> --prerelease=false --latest
          gh release create "${GITHUB_REF_NAME}" \
            "dist/HKSuite-${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HKSuite ${GITHUB_REF_NAME} (alpha)" \
            --prerelease \
            --generate-notes
